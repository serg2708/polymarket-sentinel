[project]
name = "polysentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "httpx[http2]>=0.27",
  "websockets>=13",
  "py-clob-client>=0.20",
  "asyncpg>=0.29",
  "redis[hiredis]>=5",
  "aiogram>=3.10",
  "apscheduler>=3.10",
  "structlog>=24",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sentence-transformers>=3",
  "chromadb>=0.5",
  "elote",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "feedparser",
  "tenacity>=9",
  "aiolimiter>=1.1",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "cryptography>=42",          # Kalshi RSA-PSS signing
  "anthropic>=0.28",           # Claude Haiku fallback for LLM judge
  "prometheus-client>=0.20",   # metrics exposition
  "pystan>=3.9",               # optional: Bayesian poll model (heavy, comment out if unwanted)
  "numpyro>=0.15",             # lighter Bayesian alternative
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
