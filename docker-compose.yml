services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: ${PG_PWD}
      POSTGRES_DB: polysentinel
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./ops/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polysentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G      # actual ~400MB, 5× headroom for cache growth
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # volatile-lru: evict only keys with TTL (dedup keys have TTL, news/queue don't)
    # appendonly: survive restarts without losing dedup state
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M    # Redis self-caps at 512MB; extra for OS overhead
    restart: unless-stopped

  # ollama service disabled — using host-installed Ollama (OLLAMA_HOST=0.0.0.0)
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: packages/ingest/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M    # actual ~90MB, 8× headroom
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # matcher disabled — Kalshi not used, no cross-platform arb pairs to match
  # matcher:
  #   build:
  #     context: .
  #     dockerfile: packages/matcher/Dockerfile
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file: .env
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "4.0"
  #         memory: 8G
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "20m"
  #       max-file: "3"

  detectors:
    build:
      context: .
      dockerfile: packages/detectors/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M    # actual ~80MB, 9× headroom
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M    # actual ~115MB, 4× headroom
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # prometheus and grafana disabled — not needed for bot operation
  # prometheus:
  #   image: prom/prometheus:v3.4.0
  #   ...
  # grafana:
  #   image: grafana/grafana:11.6.1
  #   ...

volumes:
  pgdata: {}
  redisdata: {}
  ollama: {}
  promdata: {}
  grafdata: {}
